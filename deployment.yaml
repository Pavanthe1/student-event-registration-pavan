apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-event-registration-pavan
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-event-registration-pavan
  template:
    metadata:
      labels:
        app: student-event-registration-pavan
    spec:
      containers:
      - name: student-event-registration-pavan
        image: raghavendrasaladi/student-event-registration-pavan:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: student-event-service-pavan
spec:
  type: NodePort
  selector:
    app: student-event-registration-pavan
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30016
